name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Lint
        run: python -m ruff check .
      - name: Type check
        run: python -m mypy src
      - name: Test
        run: python -m pytest --cov=mendpact --cov-report=term-missing
      - name: Start MCP fixture
        run: |
          python -m uvicorn examples.fixture_server:app \
            --host 127.0.0.1 \
            --port 8000 \
            > /tmp/mendpact-fixture.log 2>&1 &
          for attempt in {1..30}; do
            if curl --silent --output /dev/null http://127.0.0.1:8000/mcp; then
              exit 0
            fi
            sleep 0.5
          done
          cat /tmp/mendpact-fixture.log
          exit 1
      - name: MCP conformance smoke test
        run: >-
          mendpact conformance
          http://127.0.0.1:8000/mcp
          --allow-private
          --allow-insecure-http
          --output conformance-report.json
      - name: Upload conformance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mendpact-conformance-report
          path: conformance-report.json
          if-no-files-found: ignore
