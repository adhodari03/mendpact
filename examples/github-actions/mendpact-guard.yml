# Copy this file into .github/workflows/ in the consuming repository.
# Create the v0.1.0 tag before using the release reference below.
name: MCP contract guard

on:
  pull_request:

permissions:
  contents: read

jobs:
  mendpact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - id: mendpact
        uses: adhodari03/mendpact@v0.1.0
        with:
          mode: guard
          target: https://your-server.example/mcp
          baseline: mendpact/baseline-scan.json
          scenario: mendpact/scenarios.json
          replay: mendpact/replay.json
          output: mendpact-guard-report.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mendpact-guard-report
          path: mendpact-guard-report.json
          if-no-files-found: ignore
