name: MendPact MCP Scan
description: Scan a remote MCP endpoint for deterministic reliability and safety findings.
author: MendPact
branding:
  icon: shield
  color: blue
inputs:
  target:
    description: Remote Streamable HTTP MCP endpoint
    required: true
  fail-on:
    description: Minimum finding severity that fails the workflow
    required: false
    default: high
  output:
    description: JSON report path
    required: false
    default: mendpact-report.json
runs:
  using: composite
  steps:
    - name: Install MendPact
      shell: bash
      run: python -m pip install "${{ github.action_path }}"
    - name: Scan MCP endpoint
      shell: bash
      run: >-
        mendpact scan
        "${{ inputs.target }}"
        --fail-on "${{ inputs.fail-on }}"
        --output "${{ inputs.output }}"
